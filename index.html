<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chaa Buzz Cafe - Restaurant Management & QR Ordering System</title>
  <meta name="description" content="A modern, high-performance QR code restaurant ordering system, kitchen display system, waiter panel, and admin menu management for Chaa Buzz Cafe." />
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: {
              50: '#FFFBEB',
              100: '#FEF3C7',
              500: '#F59E0B',
              600: '#D97706',
              700: '#B45309',
              900: '#78350F',
            },
            espresso: {
              DEFAULT: '#1C1917',
              light: '#292524',
            },
            linen: '#FAF9F6'
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- QRCode Library for Vector Printing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-stone-100 text-stone-900 antialiased selection:bg-amber-500 selection:text-stone-950">
  <div id="root"></div>

  <!-- Unified Bundle Script -->
  <script type="text/babel" src="js/bundle.js"></script>
</body>
</html>
